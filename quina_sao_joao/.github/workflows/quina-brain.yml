name: "🧠 Quina Brain v3.3 - Auto Learning"

on:
  schedule:
    - cron: "0 */6 * * *"  # A cada 6 horas
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  quina-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv pip install requests

      - name: Create .env.telegram
        run: |
          echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" > quina_sao_joao/.env.telegram
          echo "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" >> quina_sao_joao/.env.telegram

      - name: Run Quina Brain - Full Coverage v3.1
        run: |
          cd quina_sao_joao
          python3 quina_full_coverage.py

      - name: Run Quina Brain - Quantum Optimizer v3.2
        run: |
          cd quina_sao_joao
          python3 quantum_optimizer.py

      - name: Run Quina Brain - Backtest Engine v3.3
        run: |
          cd quina_sao_joao
          python3 quina_backtest_engine.py

      - name: Save memory
        run: |
          cd quina_sao_joao
          git add memory/*.json output/*.json 2>/dev/null || true
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "🧠 Auto-update: $(date +'%Y-%m-%d %H:%M')" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Notify Success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            -d "text=🧠 QUINA BRAIN v3.3 - Auto Learning Complete

✅ Full Coverage v3.1: OK
✅ Quantum Optimizer v3.2: OK
✅ Backtest Engine v3.3: OK
⏰ Time: $(date +'%H:%M')
📊 Concursos: 7044
🎯 Premio: R$ 250.000.000" | bash

      - name: Notify Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID" \
            -d "text=❌ QUINA BRAIN v3.3 - ERRO

⚠️ Falha na execucao
📅 Time: $(date +'%H:%M')" | bash
