name: SIAOL-PRO SUPREMO MAX 24H

on:
  schedule:
    # Executa a cada 5 minutos, 24h por dia
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-supremo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Create directories
        run: |
          mkdir -p memory
          mkdir -p output

      - name: Verify Telegram Config
        run: |
          echo "=== SIAOL-PRO SUPREMO MAX ==="
          echo "Token: ${#TELEGRAM_BOT_TOKEN} chars"
          echo "Chat ID: $TELEGRAM_CHAT_ID"

      - name: Run SIAOL-PRO SUPREMO MAX COMPLETO
        run: python3 siaol_pro_supremo_complete.py

      - name: Upload Memory
        uses: actions/upload-artifact@v4
        with:
          name: memory-${{ github.run_number }}
          path: |
            memory/
            output/
          retention-days: 1