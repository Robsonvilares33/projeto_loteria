name: SIAOL-PRO SUPREMO MAX 24H

on:
  schedule:
    # Executa a cada 5 minutos, 24h por dia
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-supremo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.AICOUNCIL }}

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy pandas openpyxl

      - name: Create directories
        run: |
          mkdir -p memory
          mkdir -p output
          mkdir -p data

      - name: Verify Telegram Config
        run: |
          echo "=== SIAOL-PRO SUPREMO MAX ==="
          echo "Token: ${#TELEGRAM_BOT_TOKEN} chars"
          echo "Chat ID: $TELEGRAM_CHAT_ID"

      - name: Run SIAOL-PRO SUPREMO MAX v4 AUTO-EVOLUTIVO
        run: python3 siaol_pro_supremo_max_v4.py

      - name: Sync Complete Database
        run: python3 siaol_complete_database.py --sync

      - name: Run LOTOFÁCIL PORTFOLIO - Cercamento Estratégico
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║  🎯 LOTOFÁCIL PORTFOLIO - CERCAMENTO ESTRATÉGICO       ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          python3 siaol_lotofacil_portfolio.py
          echo ""
          echo "✅ Lotofácil Portfolio executado com sucesso"

      - name: Run AI COUNCIL - Conselho de IAs em Diálogo
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║  🧠 AI COUNCIL - CONSELHO DE IAs EM DIÁLOGO              ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          python3 siaol_ai_council.py
          echo ""
          echo "✅ AI Council executado com sucesso"

      - name: Upload Memory
        uses: actions/upload-artifact@v4
        with:
          name: memory-${{ github.run_number }}
          path: |
            memory/
            output/
            data/*.json
          retention-days: 1