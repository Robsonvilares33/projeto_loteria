name: "Quina Brain v3.3"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quina-brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug Environment
        run: |
          echo "=== DEBUG INFO ==="
          echo "TELEGRAM_BOT_TOKEN exists: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
          echo "TELEGRAM_CHAT_ID exists: ${{ secrets.TELEGRAM_CHAT_ID != '' }}"
          echo "Node version: $(node --version)"
          echo "Python version: $(python3 --version)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests numpy

      - name: Create directories
        run: |
          mkdir -p quina_sao_joao/memory quina_sao_joao/output

      - name: Run v3.1 Full Coverage
        continue-on-error: true
        run: |
          cd quina_sao_joao
          python3 quina_full_coverage.py

      - name: Run v3.2 Quantum Optimizer
        continue-on-error: true
        run: |
          cd quina_sao_joao
          python3 quantum_optimizer.py

      - name: Run v3.3 Backtest Engine
        continue-on-error: true
        run: |
          cd quina_sao_joao
          python3 quina_backtest_engine.py

      - name: Save memory
        run: |
          cd quina_sao_joao
          git add memory/*.json output/*.json 2>/dev/null || true
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')" 2>/dev/null || true
          git push 2>/dev/null || true

      - name: Send Success Telegram
        if: success()
        env:
          TG_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ env.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            MSG="QUINA BRAIN v3.3 - Complete | v3.1: OK | v3.2: OK | v3.3: OK | Time: $(date +'%H:%M') | Concursos: 7044"
            curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d "chat_id=$TG_CHAT" -d "text=$MSG"
          fi

      - name: Send Failure Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ env.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ env.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            MSG="QUINA BRAIN v3.3 - ERRO | Time: $(date +'%H:%M')"
            curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d "chat_id=$TG_CHAT" -d "text=$MSG"
          fi