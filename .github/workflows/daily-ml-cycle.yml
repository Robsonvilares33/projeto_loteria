name: SIAOL-PRO Daily ML Cycle

on:
  schedule:
    # Execute todo dia às 5h (horário de Brasília = UTC-3 = 8h UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  run-ml-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create output directory
        run: mkdir -p output

      - name: Verify Telegram Config
        run: |
          echo "=== TELEGRAM CONFIG ==="
          echo "Token length: ${#TELEGRAM_BOT_TOKEN}"
          echo "Chat ID: $TELEGRAM_CHAT_ID"

      - name: Run SIAOL-PRO for GitHub Actions
        run: |
          echo "=== STARTING SIAOL-PRO ==="
          python3 siaol_pro_github_actions.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: siaol-pro-outputs-${{ github.run_number }}
          path: output/
          retention-days: 7