name: SIAOL-PRO Daily ML Cycle

on:
  schedule:
    # Execute todo dia às 5h (horário de Brasília = UTC-3 = 8h UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  run-ml-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Create output directory
        run: mkdir -p output
        working-directory: projeto_loteria

      - name: Run SIAOL-PRO ML Cycle
        run: |
          echo "=== SIAOL-PRO Daily ML Cycle ===" >> output/cron.log
          echo "Date: $(date -I)" >> output/cron.log
          python3 projeto_loteria/siaol_pro_daily_cycle.py >> output/cron.log 2>&1
        working-directory: .

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: siaol-pro-outputs
          path: output/
          retention-days: 7