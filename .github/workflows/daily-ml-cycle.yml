name: SIAOL-PRO Daily ML Cycle

on:
  schedule:
    # Execute todo dia às 5h (horário de Brasília = UTC-3 = 8h UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  run-ml-cycle:
    runs-on: ubuntu-latest
    # Forçar Node.js 24 para evitar aviso de deprecação
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl matplotlib pillow

      - name: Create output directory
        run: mkdir -p output

      - name: Configure Telegram
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env.telegram
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env.telegram

      - name: Run SIAOL-PRO Complete Cycle (with Telegram)
        run: |
          echo "=== SIAOL-PRO Daily ML Cycle ===" >> output/cron.log
          echo "Date: $(date -I)" >> output/cron.log
          python3 siaol_pro_cron_complete.py >> output/cron.log 2>&1

      - name: Generate Visual Analysis
        continue-on-error: true
        run: |
          python3 siaol_pro_visual_analysis.py >> output/visual.log 2>&1 || echo "Visual analysis skipped"

      - name: Generate AI Analysis (Groq)
        if: env.GROQ_API_KEY != ''
        continue-on-error: true
        run: |
          echo "=== AI Analysis (Groq) ===" >> output/ai.log
          python3 siaol_pro_ai_analysis.py >> output/ai.log 2>&1 || echo "AI analysis skipped"

      - name: Generate AI Analysis (MiniMax)
        if: env.MINIMAX_API_KEY != ''
        continue-on-error: true
        run: |
          echo "=== AI Analysis (MiniMax) ===" >> output/minimax.log
          python3 siaol_pro_minimax_analysis.py >> output/minimax.log 2>&1 || echo "MiniMax analysis skipped"

      - name: Upload all outputs
        uses: actions/upload-artifact@v4
        with:
          name: siaol-pro-outputs-${{ github.run_number }}
          path: output/
          retention-days: 30