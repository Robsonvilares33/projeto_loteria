name: SIAOL-PRO QUANTUM ANALYSIS v4

on:
  schedule:
    # Run quantum analysis every 6 hours with v4 enhancements
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      lottery_type:
        description: 'Lottery type (lotofacil, megasena, quina, lotomania)'
        required: false
        default: 'lotofacil'
      strategy:
        description: 'Quantum strategy (walk, entanglement, variational, all)'
        required: false
        default: 'all'
      n_games:
        description: 'Number of games to generate (default: 33)'
        required: false
        default: '33'

jobs:
  quantum-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy requests

      - name: Create directories
        run: |
          mkdir -p output
          mkdir -p memory
          mkdir -p data

      - name: Run Quantum v4 Analysis
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║     SIAOL-PRO QUANTUM v4.2 - ENHANCED                    ║"
          echo "║     Non-Uniform Probabilities + Hot Numbers              ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""

          python3 quantum_v4_optimized.py

          echo ""
          echo "✅ Quantum v4 analysis complete"

      - name: Run Smart Scheduler Check
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║     SMART SCHEDULER CHECK                                ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""

          python3 siaol_smart_scheduler.py

          echo ""
          echo "✅ Smart scheduler check complete"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: quantum-v4-results-${{ github.run_number }}
          path: |
            output/quantum_v4_*.json
            output/quantum_parameter_results_*.json
            memory/quantum*.json
            memory/smart_*.json
          retention-days: 7

      - name: Update Memory Files
        run: |
          # Copy latest quantum results
          if ls output/quantum_v4_*.json 1>/dev/null 2>&1; then
            latest=$(ls -t output/quantum_v4_*.json | head -1)
            cp "$latest" memory/quantum_v4_latest.json
            echo "✅ Updated quantum_v4_latest.json"
          fi

          # Copy latest parameter results
          if ls output/quantum_parameter_results_*.json 1>/dev/null 2>&1; then
            latest=$(ls -t output/quantum_parameter_results_*.json | head -1)
            cp "$latest" memory/quantum_parameter_latest.json
            echo "✅ Updated quantum_parameter_latest.json"
          fi

      - name: Summary
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║            EXECUTION SUMMARY                              ║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 Quantum v4.2: Non-uniform probabilities + Hot numbers"
          echo "📅 Smart Scheduler: Checking for new lottery draws"
          echo ""
          echo "Generated files:"
          ls -la memory/quantum*.json 2>/dev/null || echo "No files yet"
          echo ""
          echo "✅ SIAOL-PRO Quantum Analysis v4 Complete!"