name: SIAOL-PRO SMART LEARNING SCHEDULER

on:
  schedule:
    # A cada 30 minutos - sistema decide se executa ou não
    # Apenas aprende quando há NOVOS SORTEIOS
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-smart-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.AICOUNCIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy pandas openpyxl

      - name: Create directories
        run: |
          mkdir -p memory
          mkdir -p output
          mkdir -p data

      - name: Run Smart Learning Scheduler v3.0
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════════╗"
          echo "║  🧠 SMART LEARNING SCHEDULER v3.0                       ║"
          echo "║  Aprendizado Inteligente - Só aprende quando há novos dados║"
          echo "╚═══════════════════════════════════════════════════════════╝"
          echo ""
          python3 siaol_smart_scheduler.py
          echo ""
          echo "✅ Smart Learning executado"

      - name: Upload Memory
        uses: actions/upload-artifact@v4
        with:
          name: memory-${{ github.run_number }}
          path: |
            memory/
            output/
            data/*.json
            memory/smart_learning_state.json
            memory/performance_*.json
            memory/portfolio_*.json
          retention-days: 2